# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

registries:
  # JitPack registry for UnifiedPush and other JitPack dependencies
  jitpack:
    type: maven-repository
    url: https://jitpack.io

updates:
  # Gradle dependencies (including version catalog)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    registries:
      - jitpack
    # Ignore JitPack packages as Dependabot has limited support for them
    ignore:
      - dependency-name: "com.github.*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
