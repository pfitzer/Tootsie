name: Dependency Submission

# Submits the resolved Gradle dependency graph (including the build classpath) to GitHub,
# so Dependabot alerts reflect the versions actually used on main.

# The dependency graph only changes with the build configuration
on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
