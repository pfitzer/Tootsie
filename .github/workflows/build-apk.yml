name: Build APK

# Release build: only for version tags (v1.3.0, ...) and on demand, not for every push,
# to keep the Actions minutes low. With the signing secrets set, the APK and the App
# Bundle are signed and attached to the GitHub release of the tag; without them the
# unsigned build still verifies the R8/ProGuard rules.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HAS_KEYSTORE: ${{ secrets.TOOTSIE_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The keystore only exists for this job, outside the repository
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.TOOTSIE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/tootsie.jks"

      - name: Build APK and App Bundle
        env:
          TOOTSIE_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/tootsie.jks', runner.temp) || '' }}
          TOOTSIE_KEYSTORE_PASSWORD: ${{ secrets.TOOTSIE_KEYSTORE_PASSWORD }}
          TOOTSIE_KEY_ALIAS: ${{ secrets.TOOTSIE_KEY_ALIAS }}
          TOOTSIE_KEY_PASSWORD: ${{ secrets.TOOTSIE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --console=plain

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: tootsie-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "tootsie-${GITHUB_REF_NAME}.apk"
          # Release notes: this version's section of the changelog
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '/^## \[/ { show = index($0, heading) == 1; next } show' CHANGELOG.md > release-notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Tootsie ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" "tootsie-${GITHUB_REF_NAME}.apk" --clobber
