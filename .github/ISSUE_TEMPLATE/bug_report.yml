name: Bug report
description: Something in Tootsie doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search the [existing issues](https://github.com/pfitzer/Tootsie/issues) first.
        Security vulnerabilities must not be reported here, use [private vulnerability reporting](https://github.com/pfitzer/Tootsie/security/advisories/new) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tootsie version
      description: Shown in Settings → About
      placeholder: e.g. 1.3.1
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - Google Play
        - GitHub release (APK)
        - Self-built
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: instance
    attributes:
      label: Mastodon instance
      description: The server of the affected account, and its version if you know it
      placeholder: e.g. mastodon.social (4.5.0)
  - type: dropdown
    id: push
    attributes:
      label: Notifications
      description: Only relevant for notification bugs
      options:
        - Not related to notifications
        - UnifiedPush (please name the distributor below)
        - Polling fallback
  - type: textarea
    id: additional
    attributes:
      label: Screenshots, logs and other details
      description: Remove personal data (access tokens, private posts) before posting logs.
